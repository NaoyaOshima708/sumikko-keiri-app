<ons-page id="detailPage">

    <div class="app-header-center">読み取り内容</div>
    <div class="app-header-spacer"></div>
  </div>

  <div class="wrap">
    <div class="card">
      <h1 class="page-title" id="detailTitle">（店舗名なし）</h1>
      <p class="detail-amount" id="detailAmount">-</p>
      <div class="detail-row"><span class="k">日付</span><span class="v" id="detailDate">-</span></div>
      <div class="detail-row"><span class="k">状態</span><span class="v" id="detailStatus">-</span></div>
      <p class="error-text" id="detailError"></p>
    </div>
  </div>
</ons-page>
