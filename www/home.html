<ons-page id="homePage">
  <ons-toolbar>
    <div class="center">履歴</div>
    <div class="right">
      <ons-toolbar-button id="settingsBtn">設定</ons-toolbar-button>
      <ons-toolbar-button id="homeLogoutBtn">ログアウト</ons-toolbar-button>
    </div>
  </ons-toolbar>
  <p class="lead" style="padding:12px 16px 0" id="homeLead">下の＋から撮影できます</p>
  <ons-list id="receiptList"></ons-list>
  <div class="empty-box" id="homeEmpty" style="display:none">この月の領収書はまだありません</div>
  <ons-fab class="fab-upload" position="bottom right" id="uploadFab">
    <ons-icon icon="md-plus"></ons-icon>
  </ons-fab>
</ons-page>
