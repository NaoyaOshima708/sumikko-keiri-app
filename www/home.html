<ons-page id="homePage">
  <div class="app-header">
    <div class="app-header-left">
      <img class="app-logo" src="img/sumikko-keiri-logo.png" alt="">
      <span class="app-title"><span class="b-sumikko">すみっこ</span><span class="b-keiri">経理</span></span>
    </div>
    <button type="button" class="app-header-link" id="settingsBtn">設定</button>
  </div>

  <div class="wrap">
    <div class="home-head">
      <h1>レシート履歴</h1>
      <p class="sub" id="homeLead">過去1年分</p>
    </div>
    <div class="receipt-list" id="receiptList"></div>
    <div class="empty-box" id="homeEmpty" style="display:none">
      過去1年分の領収書はまだありません
      <span class="empty-hint">右下の ＋ から撮影できます</span>
    </div>
  </div>

  <button type="button" class="fab-btn" id="uploadFab" aria-label="撮影">＋</button>
</ons-page>
