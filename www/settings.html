<ons-page id="settingsPage">
  <div class="app-header">
    <button type="button" class="app-header-link" id="settingsBackBtn">← 戻る</button>
    <div class="app-header-center">設定</div>
    <div class="app-header-spacer"></div>
  </div>

  <div class="wrap">
    <div class="card">
      <h1 class="page-title">Claude APIキー</h1>
      <p class="lead" id="settingsLead">解析に使うAPIキーを登録します。</p>

      <label class="field">APIキー
        <input id="apiKeyInput" type="password" placeholder="sk-ant-..." autocomplete="off">
      </label>

      <div class="stack">
        <button type="button" class="btn btn-primary" id="saveKeyBtn">保存</button>
      </div>
      <p class="hint-text" id="settingsHint"></p>
      <p class="error-text" id="settingsError"></p>
    </div>

    <div class="card" style="margin-top:12px">
      <button type="button" class="btn btn-outline" id="settingsLogoutBtn">ログアウト</button>
    </div>
  </div>
</ons-page>
