<ons-page id="settingsPage">
  <ons-toolbar>
    <div class="left">
      <ons-back-button>戻る</ons-back-button>
    </div>
    <div class="center">設定</div>
  </ons-toolbar>
  <div class="form-block">
    <p class="lead" id="settingsLead">Claude APIキー</p>
    <label class="field-label">APIキー</label>
    <ons-input id="apiKeyInput" type="password" modifier="underbar" placeholder="sk-ant-..." float></ons-input>
    <div class="stack-gap">
      <ons-button modifier="large" id="saveKeyBtn">保存</ons-button>
    </div>
    <p class="hint-text" id="settingsHint"></p>
    <p class="error-text" id="settingsError"></p>
  </div>
</ons-page>
