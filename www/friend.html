<ons-page id="friendPage">
  <div class="app-header">
    <div class="app-header-left">
      <img class="app-logo" src="img/sumikko-keiri-logo.png" alt="">
      <span class="app-title"><span class="b-sumikko">すみっこ</span><span class="b-keiri">経理</span></span>
    </div>
    <button type="button" class="app-header-link" id="friendLogoutBtn">ログアウト</button>
  </div>

  <div class="wrap">
    <div class="card">
      <h1 class="page-title">友だち追加が必要</h1>
      <p class="lead">公式アカウントを友だち追加すると利用できます。ブロック中も同じです。</p>
      <div class="stack">
        <button type="button" class="btn btn-line" id="openFriendBtn">友だち追加を開く</button>
        <button type="button" class="btn btn-outline" id="checkFriendBtn">追加したので確認</button>
      </div>
      <p class="error-text" id="friendError"></p>
    </div>
  </div>
</ons-page>
