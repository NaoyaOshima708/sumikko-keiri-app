<ons-page id="friendPage">
  <ons-toolbar>
    <div class="center">友だち追加が必要</div>
    <div class="right">
      <ons-toolbar-button id="friendLogoutBtn">ログアウト</ons-toolbar-button>
    </div>
  </ons-toolbar>
  <div class="form-block">
    <p class="lead">公式アカウントを友だち追加すると利用できます。ブロック中も同じです。</p>
    <div class="stack-gap">
      <ons-button modifier="large" class="btn-line" id="openFriendBtn">友だち追加を開く</ons-button>
      <ons-button modifier="large outline" id="checkFriendBtn">追加したので確認</ons-button>
    </div>
    <p class="error-text" id="friendError"></p>
  </div>
</ons-page>
