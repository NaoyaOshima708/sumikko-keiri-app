<ons-page id="csvHistoryPage">
  <div class="app-header">
    <button type="button" class="app-header-link" id="csvHistoryBackBtn">← 戻る</button>
    <div class="app-header-center">CSV履歴</div>
    <div class="app-header-spacer"></div>
  </div>

  <div class="wrap">
    <div class="card">
      <h1 class="page-title">出力履歴</h1>
      <p class="lead">端末に保存したCSVです。再共有や削除ができます。</p>
    </div>
    <div class="receipt-list" id="csvHistoryList" style="margin-top:12px"></div>
    <div class="empty-box" id="csvHistoryEmpty" style="display:none">
      まだCSV出力履歴はありません
      <span class="empty-hint">ホームの「この月をCSV出力」から作成できます</span>
    </div>
  </div>
</ons-page>
