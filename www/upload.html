<ons-page id="uploadPage">
  <div class="app-header">
    <button type="button" class="app-header-link" id="uploadBackBtn">← 戻る</button>
    <div class="app-header-center">アップロード</div>
    <div class="app-header-spacer"></div>
  </div>

  <div class="wrap">
    <div class="card">
      <h1 class="page-title">レシートを撮る</h1>
      <p class="lead">カメラまたはギャラリーから画像を選んで送信します。<br>解析は標準モデル（Claude Sonnet 5）で行います。</p>

      <div class="stack">
        <button type="button" class="btn btn-primary" id="cameraBtn">カメラで撮影</button>
        <button type="button" class="btn btn-outline" id="galleryBtn">ギャラリーから選択</button>
      </div>

      <div class="preview-row" id="previewRow"></div>

      <button type="button" class="btn btn-primary" id="sendBtn" disabled>送信して解析</button>
      <p class="hint-text" id="uploadHint"></p>
      <p class="error-text" id="uploadError"></p>
      <input id="fileFallback" type="file" accept="image/*" multiple hidden>
    </div>
  </div>
</ons-page>
