<ons-page id="loginPage">
  <ons-toolbar>
    <div class="center">
      <span class="brand-mark">
        <img src="img/sumikko-keiri-logo.png" alt="">
        <span><span class="b-sumikko">すみっこ</span><span class="b-keiri">経理</span></span>
      </span>
    </div>
  </ons-toolbar>

  <div class="wrap">
    <div class="card">
      <div class="center-col">
        <img class="logo-lg" src="img/sumikko-keiri-logo.png" alt="すみっこ経理">
        <p class="lead">メールでログインできます。<br>LINEログインはあとで接続します。</p>
      </div>

      <label class="field">メールアドレス
        <input id="emailInput" type="email" autocomplete="username" placeholder="mail@example.com">
      </label>
      <label class="field">パスワード
        <input id="passwordInput" type="password" autocomplete="current-password" placeholder="パスワード">
      </label>

      <div class="stack">
        <button type="button" class="btn btn-primary" id="loginBtn">メールでログイン</button>
      </div>
      <p class="error-text" id="loginError"></p>
    </div>
  </div>
</ons-page>
